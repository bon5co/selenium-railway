name: build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  images:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - image: selenium-standalone-chromium-railway
            file: Dockerfile.standalone
            browser: chromium
          - image: selenium-standalone-firefox-railway
            file: Dockerfile.standalone
            browser: firefox
            dev_shm: "none"
          - image: selenium-standalone-edge-railway
            file: Dockerfile.standalone
            browser: edge
          - image: selenium-hub-railway
            file: Dockerfile.hub
            browser: ""
          - image: selenium-node-chromium-railway
            file: Dockerfile.node
            browser: chromium
          - image: selenium-node-firefox-railway
            file: Dockerfile.node
            browser: firefox
            dev_shm: "none"
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.file }}
          push: true
          build-args: |
            BROWSER=${{ matrix.browser }}
            DEV_SHM_ARG=${{ matrix.dev_shm == 'none' && '' || '--disable-dev-shm-usage' }}
          tags: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:latest
